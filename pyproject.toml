[project]
name = "federated-learning-for-personalization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bytesmartbuvanese", email = "bytesmart.buvanese@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "uvicorn[standard]>=0.27",
    "xgboost>=3.4.1",
]

[project.scripts]
federated-learning-for-personalization = "federated_learning_for_personalization:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
